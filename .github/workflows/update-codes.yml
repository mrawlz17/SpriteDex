name: Update Override Codes

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-codes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4

      - name: Check public sources for Override codes
        run: python scripts/update_codes.py

      - name: Commit code database changes
        shell: bash
        run: |
          if git diff --quiet -- codes.json; then
            echo "No Override code changes."
            exit 0
          fi
          git config user.name "SpriteDex Bot"
          git config user.email "actions@users.noreply.github.com"
          git add codes.json
          git commit -m "Update Override code database"
          git push
