name: Update Sprite Database

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spritedex-data-writers
  cancel-in-progress: false

jobs:
  update-sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4

      - name: Check Fortnite.GG for released Sprites
        run: python scripts/update_sprites.py

      - name: Commit database changes
        shell: bash
        run: |
          if git diff --quiet -- sprites.json; then
            echo "No Sprite database changes."
            exit 0
          fi
          git config user.name "SpriteDex Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sprites.json
          git commit -m "Update Sprite database"
          git pull --rebase origin main
          git push
